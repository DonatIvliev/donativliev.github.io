<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Single Page App GitHub Pages redirect for username.github.io
    // Redirects all 404s to index.html for client-side routing
    const pathSegmentsToKeep = 0; // 0 for username.github.io, 1 for project pages
    
    const location = window.location;
    const path = location.pathname;
    
    // Redirect to root with path in sessionStorage
    sessionStorage.setItem('redirectPath', path);
    window.location.replace('/' + location.search + location.hash);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
